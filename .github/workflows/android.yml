name: Android

# Se valida en cada pull request y push a main; también puede lanzarse manualmente.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar la firma
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/studio-nails-release.keystore
          cat > keystore.properties << EOF
          storeFile=keystore/studio-nails-release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Compilar la APK firmada
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --stacktrace

      - name: Comprobar el SHA-256
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")
          printf '%s\n' "$CERT_INFO"
          ACTUAL=$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED="131ac84a4240b0ad921ca700f0dbd9984b7554fb99f40f96c97f08e95cac952a"
          test -n "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::La huella SHA-256 del certificado no coincide con la esperada."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: studio-nails-1.0
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
